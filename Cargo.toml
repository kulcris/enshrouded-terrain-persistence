[package]
name = "terrain-persistence"
version = "0.5.0"
edition = "2024"
description = "Server-side terrain persistence inside and outside Flame Altar zones"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.enshwick]
id = "kulcr.terrain-persistence"
side = "server"
name = "Terrain Persistence"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redb = "=4.5.0"
toml = "1.1"
enshwick = { git = "https://github.com/enshwick/enshwick", rev = "945a1b8f0c9d1971679d9f3bc3dcecc127a5bcad", features = ["unstable"] }

[profile.release]
panic = "unwind"
