name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust 1.99.1 with GNU target
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1-x86_64-pc-windows-gnu --profile minimal
          rustup default 1.99.1-x86_64-pc-windows-gnu

      - name: Test library
        shell: pwsh
        env:
          RUSTFLAGS: -C linker=rust-lld -C linker-flavor=ld.lld -C link-self-contained=yes
        run: cargo +1.99.1-x86_64-pc-windows-gnu test --lib --locked

      - name: Build release DLL
        shell: pwsh
        env:
          RUSTFLAGS: -C linker=rust-lld -C linker-flavor=ld.lld -C link-self-contained=yes
        run: cargo +1.99.1-x86_64-pc-windows-gnu build --release --locked

      - name: Package mod
        shell: pwsh
        run: ./Package-Mod.ps1 -SkipBuild

      - name: Upload packaged ZIP
        uses: actions/upload-artifact@v4
        with:
          name: terrain-persistence-windows
          path: |
            dist/terrain-persistence-*-windows.zip
            dist/terrain-persistence-*-windows.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate tag version
        shell: pwsh
        run: |
          $cargoVersion = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($tagVersion -ne $cargoVersion) {
            throw "Release tag v$tagVersion does not match Cargo.toml version $cargoVersion"
          }

      - name: Download packaged ZIP
        uses: actions/download-artifact@v4
        with:
          name: terrain-persistence-windows
          path: dist

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem dist -File | Select-Object -ExpandProperty FullName)
          gh release create "$env:GITHUB_REF_NAME" @files --title "$env:GITHUB_REF_NAME" --generate-notes --verify-tag
