name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download and verify Enshwick alpha 13 runtime
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'enshwick-alpha13.zip'
          Invoke-WebRequest -Uri 'https://github.com/enshwick/enshwick/releases/download/v1.0.0-alpha.13/enshwick.zip' -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'c08158ab9d331e02a06c57828e9b7d92451a65da7ad4d42f4dcaeab851184853'
          if ($actual -ne $expected) { throw "Enshwick alpha 13 checksum mismatch: $actual" }
          $destination = Join-Path $env:GITHUB_WORKSPACE 'tools/enshwick-alpha13'
          New-Item -ItemType Directory -Force $destination | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force

      - name: Install Rust 1.99.1 with GNU target
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1-x86_64-pc-windows-gnu --profile minimal
          rustup default 1.99.1-x86_64-pc-windows-gnu

      - name: Test library
        shell: pwsh
        env:
          RUSTFLAGS: -C linker=rust-lld -C linker-flavor=ld.lld -C link-self-contained=yes
        run: cargo +1.99.1-x86_64-pc-windows-gnu test --lib --locked

      - name: Build release DLL
        shell: pwsh
        env:
          RUSTFLAGS: -C linker=rust-lld -C linker-flavor=ld.lld -C link-self-contained=yes
        run: cargo +1.99.1-x86_64-pc-windows-gnu build --release --locked

      - name: Package mod
        shell: pwsh
        run: ./.github/package.ps1

      - name: Upload packaged ZIP
        uses: actions/upload-artifact@v4
        with:
          name: terrain-persistence-windows
          path: |
            dist/terrain-persistence-*-windows.zip
            dist/terrain-persistence-*-windows.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate tag version
        shell: pwsh
        run: |
          $cargoVersion = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($tagVersion -ne $cargoVersion) {
            throw "Release tag v$tagVersion does not match Cargo.toml version $cargoVersion"
          }

      - name: Download packaged ZIP
        uses: actions/download-artifact@v4
        with:
          name: terrain-persistence-windows
          path: dist

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem dist -File | Select-Object -ExpandProperty FullName)
          gh release create "$env:GITHUB_REF_NAME" @files --title "Terrain Persistence $env:GITHUB_REF_NAME" --notes-file .github/RELEASE-NOTES.md --verify-tag
